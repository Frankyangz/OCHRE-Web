name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm lint

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      # Prerendering reads the live OCHRE API, so this step depends on an
      # upstream service. The fetch layer retries transient failures; a
      # sustained outage will still fail here, which is the intended signal.
      - name: Build
        run: pnpm build
