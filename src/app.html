<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#e9e7e0" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191c21" />
		<script>
			// Resolve the theme before first paint so the page never flashes light.
			(() => {
				try {
					const stored = localStorage.getItem('theme');
					const dark =
						stored === 'dark' ||
						(stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.classList.toggle('dark', dark);
				} catch {
					/* private mode — fall back to the light default */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
